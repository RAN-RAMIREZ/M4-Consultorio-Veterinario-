<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso · Consultorio Veterinario (M4)</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">
  <main class="login-wrapper">
    <section class="login-card">
      <header class="login-header">
        <div class="login-icon" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 6v12M6 12h12"/>
            <rect x="3" y="3" width="18" height="18" rx="4"/>
          </svg>
        </div>
        <span class="login-badge">Módulo M4 · Tenencia Responsable</span>
        <h1>Consultorio Veterinario</h1>
        <p>Inicia sesión con tus credenciales del Núcleo</p>
      </header>

      <form id="login-form" class="login-form">
        <div class="login-field">
          <label for="rut">RUT</label>
          <input
            type="text"
            id="rut"
            name="rut"
            placeholder="Ej: 15555555-6"
            autocomplete="username"
            required
          >
        </div>

        <div class="login-field">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
            required
          >
        </div>

        <p id="mensaje" class="login-mensaje" role="alert"></p>

        <button type="submit" class="login-btn">Iniciar sesión</button>
      </form>

      <footer class="login-footer">
        <span>Sistema Municipal · Atención Clínica Veterinaria</span>
      </footer>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
